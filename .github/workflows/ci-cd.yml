name: CI/CD frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  deploy:
    name: Validate Render Docker image
    runs-on: ubuntu-latest
    needs: [build, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build -t gamarra-digital:render .
      - name: Check container routes
        run: |
          docker run -d --name gamarra-render -e PORT=10000 -p 10000:10000 gamarra-digital:render
          for route in / /css/style.css /js/main.js /models/productoModel.js /views/productoView.js /controllers/productoController.js /assets/img/portada.jpg; do
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "http://localhost:10000$route" --output /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gamarra-digital-static
          path: |
            index.html
            css/
            js/
            models/
            views/
            controllers/
            assets/
